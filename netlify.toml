# ConnectPhone Ταμείο — αποσυρμένο.
# Ο,τι μένει εδώ είναι μια σελίδα που λέει στο προσωπικό πού μετακόμισε το ταμείο.

[build]
  publish = "."

# Η σελίδα τερματισμού και ο διακόπτης ΔΕΝ αποθηκεύονται ποτέ: κάθε συσκευή που
# ανοίγει το παλιό site πρέπει να τα πάρει φρέσκα, αλλιώς συνεχίζει να βλέπει το
# αντίγραφο της παλιάς εφαρμογής που έχει ήδη στη μνήμη της.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Κάθε παλιός σύνδεσμος — αποθήκη, πωλήσεις, QR — καταλήγει στην ανακοίνωση.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
